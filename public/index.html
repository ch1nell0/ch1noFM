<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ch1noFM — Web Radio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

    <style>
        :root {
            --bg: #0a0c10;
            --bg-panel: #12151b;
            --bg-panel-2: #181c24;
            --bg-inset: #0e1116;
            --border: #242a35;
            --border-soft: #1b202a;
            --text: #ece8df;
            --text-dim: #9096a3;
            --text-faint: #565c6a;
            --accent: #ff8a3d;
            --accent-soft: rgba(255, 138, 61, 0.14);
            --accent-2: #f2c14e;
            --danger: #e05a52;
            --ok: #52c78f;
            --radius-lg: 18px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --font-display: 'Fraunces', Georgia, serif;
            --font-mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background:
                radial-gradient(1100px 500px at 50% -10%, rgba(255, 138, 61, 0.09), transparent 60%),
                var(--bg);
            color: var(--text);
            font-family: var(--font-mono);
            display: flex;
            justify-content: center;
            padding: 28px 16px 60px;
            min-height: 100vh;
        }

        .page { width: 100%; max-width: 980px; display: flex; flex-direction: column; gap: 18px; }

        .station-header { display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px 2px; }
        .station-name { font-family: var(--font-display); font-weight: 900; font-size: 1.7rem; letter-spacing: -0.02em; color: var(--text); }
        .station-name span { color: var(--accent); }
        .station-tag { font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-faint); }

        /* ---------- Bacheca (header board) ---------- */
        .board {
            background: repeating-linear-gradient(180deg, var(--bg-panel) 0px, var(--bg-panel) 27px, var(--border-soft) 28px);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 14px 18px;
            min-height: 58px;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .board-pin { font-size: 0.9rem; flex-shrink: 0; opacity: 0.8; }
        .board-content {
            flex: 1;
            font-size: 0.82rem;
            color: var(--text-dim);
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
        }
        .board-content.is-empty { color: var(--text-faint); font-style: italic; }
        .board-edit-btn {
            flex-shrink: 0; background: transparent; border: 1px solid var(--border);
            color: var(--text-faint); font-family: var(--font-mono); font-size: 0.68rem;
            text-transform: uppercase; letter-spacing: 0.08em; padding: 6px 10px;
            border-radius: var(--radius-sm); cursor: pointer; transition: color 0.15s, border-color 0.15s;
        }
        .board-edit-btn:hover { color: var(--accent); border-color: var(--accent); }
        .board-editor { display: none; flex: 1; gap: 10px; align-items: flex-start; }
        .board-editor.active { display: flex; }
        .board-editor textarea {
            flex: 1; background: var(--bg-inset); border: 1px solid var(--border); color: var(--text);
            font-family: var(--font-mono); font-size: 0.82rem; padding: 8px 10px; border-radius: var(--radius-sm);
            resize: vertical; min-height: 44px; outline: none;
        }
        .board-editor textarea:focus { border-color: var(--accent); }
        .board-save-btn {
            background: var(--accent); color: #1a0e05; border: none; padding: 8px 14px;
            border-radius: var(--radius-sm); font-family: var(--font-mono); font-weight: 700;
            font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; cursor: pointer;
        }

        /* ---------- Layout ---------- */
        .layout { display: grid; grid-template-columns: 1fr 300px; gap: 18px; align-items: start; }
        .main-col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
        .side-col { display: flex; flex-direction: column; gap: 18px; }

        @media (max-width: 800px) {
            .layout { grid-template-columns: 1fr; }
            .side-col { order: -1; }
        }

        /* ---------- Cards ---------- */
        .player-card, .queue-card, .request-card, .artist-card {
            background: linear-gradient(180deg, var(--bg-panel) 0%, var(--bg-panel-2) 100%);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 26px;
            position: relative;
        }
        .player-card { box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255,255,255,0.02); }

        .card-label {
            font-size: 0.68rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
            color: var(--text-faint); margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
        }
        .card-label::after { content: ''; flex: 1; height: 1px; background: var(--border-soft); }

        .on-air {
            display: inline-flex; align-items: center; gap: 7px;
            background: var(--accent-soft); border: 1px solid rgba(255, 138, 61, 0.35);
            color: var(--accent); padding: 5px 13px; border-radius: 999px;
            font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
            margin-bottom: 22px;
        }
        .on-air .lamp { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: blink 1.6s ease-in-out infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

        .cover-frame-wrap { display: flex; justify-content: center; margin-bottom: 20px; }
        .cover-frame {
            width: 190px; height: 190px; border-radius: 22px; overflow: hidden;
            position: relative; border: 1px solid var(--border);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
            transition: box-shadow 0.5s ease, transform 0.5s ease;
        }
        body.is-playing .cover-frame {
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55), 0 0 0 3px var(--accent-soft), 0 0 44px rgba(255, 138, 61, 0.28);
        }
        .album-cover { width: 100%; height: 100%; object-fit: cover; display: block; }
        .cover-frame::after {
            /* sottile riflesso in alto, da' un po' di profondità senza essere invadente */
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 35%);
            pointer-events: none;
        }

        .song-title { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; color: #fff; text-align: center; margin-bottom: 4px; word-break: break-word; line-height: 1.2; }
        .song-artist { font-size: 0.82rem; color: var(--text-dim); text-align: center; margin-bottom: 18px; letter-spacing: 0.01em; }

        /* ---------- Waveform ("wave candy" style progress) ---------- */
        .waveform { display: flex; align-items: center; gap: 1.5px; height: 40px; margin-bottom: 16px; }
        .waveform .bar {
            flex: 1; min-width: 2px; background: var(--border); border-radius: 2px;
            transition: background 0.2s ease, opacity 0.2s ease;
        }
        .waveform .bar.played { background: var(--accent); }
        body.is-playing .waveform .bar.played:nth-child(3n) { animation: kick 0.9s ease-in-out infinite; }
        body.is-playing .waveform .bar.played:nth-child(3n+1) { animation: kick 0.9s ease-in-out infinite 0.15s; }
        @keyframes kick { 0%, 100% { opacity: 0.75; } 50% { opacity: 1; } }
        .waveform-time { display: flex; justify-content: space-between; font-size: 0.66rem; color: var(--text-faint); margin-bottom: 18px; letter-spacing: 0.03em; }

        .requested-by {
            font-size: 0.72rem; color: var(--text-faint); background: var(--bg-inset);
            border: 1px solid var(--border-soft); padding: 6px 14px; border-radius: var(--radius-sm);
            display: block; width: fit-content; margin: 0 auto 20px;
        }
        .requested-by b { color: var(--text-dim); font-weight: 600; }

        audio { display: none; }

        .controls-row { display: flex; gap: 10px; }
        .start-audio-btn, .skip-btn {
            border: none; padding: 13px 16px; border-radius: var(--radius-sm);
            font-family: var(--font-mono); font-weight: 700; font-size: 0.78rem;
            letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer;
            transition: transform 0.15s ease, filter 0.15s ease;
        }
        .start-audio-btn:hover, .skip-btn:hover { filter: brightness(1.12); transform: translateY(-1px); }
        .start-audio-btn { flex: 1.4; background: var(--accent); color: #1a0e05; }
        .start-audio-btn.is-ready { background: var(--ok); color: #06251a; }
        .skip-btn { flex: 1; background: var(--bg-inset); color: var(--text-dim); border: 1px solid var(--border); }
        .skip-btn:hover { color: var(--danger); border-color: var(--danger); }

        /* ---------- Queue ---------- */
        .queue-list { list-style: none; display: flex; flex-direction: column; gap: 9px; max-height: 320px; overflow-y: auto; }
        .queue-item {
            background: var(--bg-inset); border: 1px solid var(--border-soft);
            padding: 10px 14px; border-radius: var(--radius-md);
            display: flex; align-items: center; gap: 12px; font-size: 0.84rem;
        }
        .queue-item .idx { color: var(--accent); font-weight: 700; min-width: 22px; }
        .queue-item .mini-cover { width: 38px; height: 38px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: var(--bg-panel); border: 1px solid var(--border-soft); }
        .queue-item .meta { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
        .queue-item .meta .artist { color: var(--text-faint); }
        .queue-empty { color: var(--text-faint); font-size: 0.8rem; text-align: center; padding: 14px 0; }

        /* ---------- Cronologia (sidebar) ---------- */
        .history-card {
            background: linear-gradient(180deg, var(--bg-panel) 0%, var(--bg-panel-2) 100%);
            border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 22px;
        }
        .mini-track-list { list-style: none; display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow-y: auto; }
        .mini-track-item { display: flex; align-items: center; gap: 10px; font-size: 0.76rem; }
        .mini-track-item .mini-cover { width: 26px; height: 26px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: var(--bg-inset); border: 1px solid var(--border-soft); }
        .mini-track-item .meta { flex: 1; min-width: 0; overflow: hidden; }
        .mini-track-item .meta .title-line { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .mini-track-item .meta .artist-line { color: var(--text-faint); font-size: 0.68rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .mini-track-item .when { color: var(--text-faint); font-size: 0.65rem; flex-shrink: 0; }

        /* ---------- Request form ---------- */
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
        label { font-size: 0.68rem; color: var(--text-faint); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
        input[type="text"], input[type="file"] {
            background: var(--bg-inset); border: 1px solid var(--border); color: var(--text);
            padding: 11px 12px; border-radius: var(--radius-sm); font-size: 0.85rem;
            font-family: var(--font-mono); outline: none; transition: border-color 0.15s ease;
        }
        input[type="text"]:focus { border-color: var(--accent); }
        input[type="file"] { font-size: 0.78rem; }
        .or-divider { text-align: center; color: var(--text-faint); font-size: 0.72rem; margin: 4px 0 12px; text-transform: uppercase; letter-spacing: 0.1em; }
        .submit-btn {
            background: var(--accent); color: #1a0e05; border: none; padding: 13px;
            border-radius: var(--radius-sm); font-family: var(--font-mono); font-weight: 700;
            font-size: 0.8rem; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; width: 100%;
            transition: filter 0.15s ease, transform 0.15s ease;
        }
        .submit-btn:hover:not(:disabled) { filter: brightness(1.12); transform: translateY(-1px); }
        .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        #status-msg { margin-top: 10px; font-size: 0.78rem; text-align: center; min-height: 1em; }

        /* ---------- Dialog upload locale (titolo + copertina opzionali) ---------- */
        .upload-details { border-top: 1px dashed var(--border); margin-top: 4px; padding-top: 14px; margin-bottom: 14px; }
        .cover-choice-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .cover-choice-row input[type="file"] { flex: 1; min-width: 160px; }
        .cover-gallery-btn {
            background: var(--bg-inset); border: 1px solid var(--border); color: var(--text-dim);
            font-family: var(--font-mono); font-size: 0.72rem; padding: 9px 12px; border-radius: var(--radius-sm);
            cursor: pointer; white-space: nowrap;
        }
        .cover-gallery-btn:hover { color: var(--text); border-color: var(--accent); }
        .placeholder-gallery {
            display: none; flex-wrap: wrap; gap: 8px; margin-top: 10px;
            padding: 10px; background: var(--bg-inset); border-radius: var(--radius-sm); border: 1px solid var(--border-soft);
        }
        .placeholder-gallery.active { display: flex; }
        .placeholder-gallery img {
            width: 44px; height: 44px; border-radius: 8px; object-fit: cover; cursor: pointer;
            border: 2px solid transparent; transition: border-color 0.15s ease;
        }
        .placeholder-gallery img:hover { border-color: var(--accent); }
        .cover-preview-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
        .cover-preview-row img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border-soft); }
        .clear-cover-btn {
            background: none; border: 1px solid var(--border); color: var(--text-faint);
            font-family: var(--font-mono); font-size: 0.68rem; padding: 5px 9px; border-radius: var(--radius-sm); cursor: pointer;
        }
        .clear-cover-btn:hover { color: var(--danger); border-color: var(--danger); }

        /* ---------- Artist card ---------- */
        .artist-card { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .artist-photo-wrap {
            width: 100%; aspect-ratio: 1 / 1; border-radius: var(--radius-md); overflow: hidden;
            background: var(--bg-inset); border: 1px solid var(--border-soft); margin-bottom: 14px;
        }
        .artist-photo-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .artist-name { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; color: #fff; margin-bottom: 8px; }
        .artist-bio { font-size: 0.76rem; color: var(--text-dim); line-height: 1.55; text-align: left; flex: 1; }
        .artist-bio.is-empty { color: var(--text-faint); font-style: italic; text-align: center; }
        .bio-row { display: flex; align-items: flex-start; gap: 8px; width: 100%; }
        .bio-translate-btn {
            flex-shrink: 0; background: var(--bg-inset); border: 1px solid var(--border-soft);
            border-radius: var(--radius-sm); width: 26px; height: 26px; display: inline-flex;
            align-items: center; justify-content: center; cursor: pointer; font-size: 0.85rem;
            padding: 0; transition: border-color 0.15s ease, filter 0.15s ease;
        }
        .bio-translate-btn:hover { filter: brightness(1.2); }
        .bio-translate-btn.active { border-color: var(--accent); background: var(--accent-soft); }
        .bio-translate-btn:disabled { opacity: 0.5; cursor: wait; }
        /* Selettore artisti in stile Spotify: principale + featured, cliccabili per switchare */
        .artist-switcher { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 14px; }
        .artist-chip {
            display: flex; align-items: center; gap: 6px; background: var(--bg-inset);
            border: 1px solid var(--border-soft); border-radius: 999px; padding: 4px 10px 4px 4px;
            cursor: pointer; font-size: 0.68rem; color: var(--text-dim);
            transition: border-color 0.15s ease, color 0.15s ease;
        }
        .artist-chip img { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; display: block; }
        .artist-chip:hover { color: var(--text); border-color: var(--border); }
        .artist-chip.active { border-color: var(--accent); color: var(--accent); }
        .artist-chip .role { font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.04em; opacity: 0.7; }
        .artist-source { font-size: 0.62rem; color: var(--text-faint); margin-top: 10px; text-transform: uppercase; letter-spacing: 0.08em; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        @media (max-width: 420px) {
            .player-card, .queue-card, .request-card, .artist-card { padding: 20px; }
            .cover-frame { width: 150px; height: 150px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .on-air .lamp, .waveform .bar { animation: none !important; }
        }
    </style>
</head>
<body>

    <div class="page">

        <div class="station-header">
            <div class="station-name">ch1no<span>FM</span></div>
            <div class="station-tag">Radio tra amici</div>
        </div>

        <div class="board">
            <div class="board-pin">📌</div>
            <div class="board-content is-empty" id="board-content">La bacheca è vuota.</div>
            <div class="board-editor" id="board-editor">
                <textarea id="board-textarea" placeholder="Scrivi qualcosa per tutti..."></textarea>
                <button class="board-save-btn" id="board-save-btn">Salva</button>
            </div>
            <button class="board-edit-btn" id="board-edit-btn">✏️ Modifica</button>
        </div>

        <div class="layout">
            <div class="main-col">

                <div class="player-card">
                    <div class="on-air"><span class="lamp"></span> On air</div>

                    <div class="cover-frame-wrap">
                        <div class="cover-frame">
                            <img id="album-cover" class="album-cover" src="https://via.placeholder.com/380/12151b/565c6a?text=%E2%99%AB" alt="Cover">
                        </div>
                    </div>

                    <div id="song-title" class="song-title">In attesa di brani...</div>
                    <div id="song-artist" class="song-artist">Radio online</div>

                    <div class="waveform" id="waveform" aria-hidden="true"></div>
                    <div class="waveform-time">
                        <span id="time-current">0:00</span>
                        <span id="time-total">--:--</span>
                    </div>

                    <div style="text-align:center;">
                        <div class="requested-by">richiesta da <b id="requested-by">—</b></div>
                    </div>

                    <audio id="radio-player" autoplay></audio>

                    <div class="controls-row">
                        <button class="start-audio-btn" id="enable-audio-btn">🔊 Avvia stream</button>
                        <button class="skip-btn" onclick="forceSkip()">⏭️ Skip</button>
                    </div>
                </div>

                <div class="queue-card">
                    <div class="card-label">Coda brani</div>
                    <ul id="queue-list" class="queue-list">
                        <li class="queue-empty">La coda è vuota.</li>
                    </ul>
                </div>

                <div class="request-card">
                    <div class="card-label">Richiedi un brano</div>
                    <div class="form-group">
                        <label>Link YouTube o URL MP3 diretto</label>
                        <input type="text" id="song-link" placeholder="Incolla URL YouTube o MP3...">
                    </div>
                    <div class="or-divider">oppure</div>
                    <div class="form-group">
                        <label>Carica file audio da PC (MP3, WAV)</label>
                        <input type="file" id="file-input" accept="audio/*">
                    </div>

                    <div class="upload-details" id="upload-details" style="display:none;">
                        <div class="form-group">
                            <label>Titolo (opzionale)</label>
                            <input type="text" id="upload-title-input" placeholder="Nome del brano...">
                        </div>
                        <div class="form-group">
                            <label>Copertina (opzionale)</label>
                            <div class="cover-choice-row">
                                <input type="file" id="upload-cover-input" accept="image/*">
                                <button type="button" class="cover-gallery-btn" id="open-placeholder-gallery-btn">🖼️ Scegli da galleria</button>
                            </div>
                            <div class="placeholder-gallery" id="placeholder-gallery"></div>
                            <div class="cover-preview-row" id="cover-preview-row" style="display:none;">
                                <img id="cover-preview-img" alt="Copertina scelta">
                                <button type="button" class="clear-cover-btn" id="clear-cover-btn">✕ rimuovi</button>
                            </div>
                        </div>
                    </div>

                    <button class="submit-btn" id="submit-btn" onclick="handleFormSubmit()">Invia in coda</button>
                    <div id="status-msg"></div>
                </div>

            </div>

            <div class="side-col">
                <div class="artist-card">
                    <div class="artist-photo-wrap">
                        <img id="artist-photo" src="https://via.placeholder.com/300/12151b/565c6a?text=%E2%99%AB" alt="Artista">
                    </div>
                    <div class="artist-name" id="artist-name">—</div>
                    <div class="bio-row">
                        <div class="artist-bio is-empty" id="artist-bio">Nessun brano in riproduzione.</div>
                        <button class="bio-translate-btn" id="bio-translate-btn" title="Traduci in italiano" style="display:none;">🌐</button>
                    </div>
                    <div class="artist-switcher" id="artist-switcher"></div>
                </div>

                <div class="history-card">
                    <div class="card-label">Ultime canzoni</div>
                    <ul class="mini-track-list" id="history-list">
                        <li class="queue-empty">Ancora nessuna canzone suonata.</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>


    <script src="youtube-radio.js"></script>

    <script>
        // --- CONFIGURAZIONE SUPABASE ---
        const SUPABASE_URL = "https://vpkpyepszskgustruoyl.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable__C7yHVyoeO0EAEOKOnSnLw_ebv3Zpp2";
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let userId = localStorage.getItem("radio_uid") || "User_" + Math.floor(Math.random() * 8999 + 1000);
        localStorage.setItem("radio_uid", userId);

        const BACKEND_URL = "https://ch1nofm.onrender.com";

        // ================= WAVEFORM =================
        const WAVE_BAR_COUNT = 56;
        let waveDuration = 0;
        let ytPollTimer = null;

        function hashStr(str) {
            let h = 0;
            for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
            return h;
        }
        function seededRandom(seed) {
            let s = seed >>> 0;
            return function () {
                s |= 0; s = (s + 0x6D2B79F5) | 0;
                let t = Math.imul(s ^ (s >>> 15), 1 | s);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }
        function buildWaveform(seedStr) {
            const rand = seededRandom(hashStr(seedStr || 'ch1noFM'));
            const el = document.getElementById('waveform');
            el.innerHTML = '';
            for (let i = 0; i < WAVE_BAR_COUNT; i++) {
                const isKick = i % 4 === 0 || rand() > 0.82;
                const h = isKick ? 45 + rand() * 55 : 12 + rand() * 30;
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.height = Math.round(h) + '%';
                el.appendChild(bar);
            }
        }
        function formatTime(sec) {
            if (!isFinite(sec) || sec < 0) return '--:--';
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return m + ':' + String(s).padStart(2, '0');
        }
        function updateWaveformProgress(currentTime, duration) {
            document.getElementById('time-current').innerText = formatTime(currentTime);
            document.getElementById('time-total').innerText = duration > 0 ? formatTime(duration) : '--:--';
            if (!duration || duration <= 0) return;
            const fraction = Math.min(1, Math.max(0, currentTime / duration));
            const playedCount = Math.round(fraction * WAVE_BAR_COUNT);
            const bars = document.getElementById('waveform').children;
            for (let i = 0; i < bars.length; i++) {
                bars[i].classList.toggle('played', i < playedCount);
            }
        }
        function stopYtPolling() {
            if (ytPollTimer) { clearInterval(ytPollTimer); ytPollTimer = null; }
        }
        function startYtPolling() {
            stopYtPolling();
            ytPollTimer = setInterval(() => {
                if (!window.ChinoFMYouTube) return;
                const ct = window.ChinoFMYouTube.getCurrentTime();
                const dur = window.ChinoFMYouTube.getDuration();
                if (dur > 0) updateWaveformProgress(ct, dur);
            }, 500);
        }

        // ================= AUTO-ADVANCE: radio vera, niente skip manuale =================
        // Tutti i client ascoltano la fine del brano e chiamano advanceQueue().
        // Un piccolo ritardo casuale riduce (ma non azzera del tutto) la possibilità
        // che due client tentino di avanzare nello stesso istante: se succede non è
        // comunque un problema serio, nel peggiore dei casi lo start_time del prossimo
        // brano si aggiorna due volte a distanza di pochi millisecondi.
        let autoAdvanceLock = false;
        function autoAdvance() {
            if (autoAdvanceLock) return;
            autoAdvanceLock = true;
            const jitter = Math.random() * 700;
            setTimeout(() => {
                advanceQueue().finally(() => { autoAdvanceLock = false; });
            }, jitter);
        }

        window.addEventListener('chinofm:ytstate', (e) => {

        async function toggleBioTranslation() {
            if (!currentBioOriginal) return;
            const btn = document.getElementById('bio-translate-btn');
            if (bioShowingTranslation) {
                setBioText(currentBioOriginal, false);
                bioShowingTranslation = false;
                btn.classList.remove('active');
                return;

            if (currentBioTranslated) {
                setBioText(currentBioTranslated, false);
                bioShowingTranslation = true;
                btn.classList.add('active');
                return;
            }
            btn.disabled = true;
            try {
                const url = `${BACKEND_URL}/translate?text=${encodeURIComponent(currentBioOriginal)}&target=it`;
                const res = await fetch(url);
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'HTTP ' + res.status);
                currentBioTranslated = data.translated;
                setBioText(currentBioTranslated, false);
                bioShowingTranslation = true;
                btn.classList.add('active');

                console.warn('Traduzione fallita:', e.message);

        async function loadEnrichment(title, artist, coverHint) {
            const seq = ++enrichSeq;
            const artistNameEl = document.getElementById('artist-name');
            const artistPhotoEl = document.getElementById('artist-photo');
            const songArtistEl = document.getElementById('song-artist');

            artistNameEl.innerText = artist || '—';
            setBioText('Cerco informazioni...', true);
            artistPhotoEl.src = PLACEHOLDER_ARTIST_PHOTO;
            document.getElementById('artist-switcher').innerHTML = '';
            if (coverHint) document.getElementById('album-cover').src = coverHint;

            try {
                let url = `${BACKEND_URL}/enrich?title=${encodeURIComponent(title || '')}&artist=${encodeURIComponent(artist || '')}`;
                if (coverHint) url += `&coverHint=${encodeURIComponent(coverHint)}`;
                const res = await fetch(url);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                if (seq !== enrichSeq) return; // una richiesta più recente ha già preso il sopravvento

                if (data.cover) document.getElementById('album-cover').src = data.cover;

                const artists = Array.isArray(data.artists) ? data.artists : [];
                if (artists.length > 0) {
                    renderArtistSwitcher(artists);
                    showArtist(0);
                    const primaryNames = artists.filter(a => a.role === 'primary').map(a => a.name).join(' & ');
                    if (primaryNames) songArtistEl.innerText = primaryNames;
                } else {
                    showPlaceholderArtist();
                }
            } catch (e) {
                console.warn('Enrichment fallito:', e.message);
                if (seq !== enrichSeq) return;
                showPlaceholderArtist();
            }
        }

        // --- Helper: normalize/extract YouTube ID from many link forms ---

        function getYouTubeIdFromAny(url) {
          if (!url || typeof url !== 'string') return null;
          const s = url.trim();
          if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
          const m = s.match(/(?:v=|\/live\/|\/shorts\/|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
          return m ? m[1] : null;
        }

        async function fetchJson(url, options) {
            let res;
            try {
                res = await fetch(url, options);
            } catch (networkErr) {
                throw new Error(
                    "Impossibile contattare il backend (" + BACKEND_URL + "). " +
                    "Potrebbe essere ancora in fase di avvio: riprova tra 30-60 secondi."
                );
            }
            const raw = await res.text();
            let data;
            try {
                data = raw ? JSON.parse(raw) : {};
            } catch (parseErr) {
                console.error("Risposta non-JSON dal backend:", raw.slice(0, 300));
                throw new Error("Il backend ha risposto in modo inatteso (controlla i log su Render).");
            }
            if (!res.ok) throw new Error(data.error || `Errore backend (HTTP ${res.status})`);
            return data;
        }

        async function handleFormSubmit() {
            const statusMsg = document.getElementById("status-msg");
            const submitBtn = document.getElementById("submit-btn");
            const link = document.getElementById("song-link").value.trim();
            const fileInput = document.getElementById("file-input");
            const file = fileInput.files[0];

            submitBtn.disabled = true;
            statusMsg.style.color = "#f2c14e";
            statusMsg.innerText = "⏳ Inserimento in corso...";

            try {
                let songData = { requestedBy: userId };

                if (file) {
                    if (file.size > 25 * 1024 * 1024) {
                        statusMsg.style.color = "#e05a52";
                        statusMsg.innerText = "⚠️ Il file supera i 25 MB!";
                        submitBtn.disabled = false;
                        return;
                    }
                    statusMsg.innerText = "⏫ Caricamento file in corso...";
                    const result = await requestUpload(file);
                    songData.type = "file";
                    songData.audioUrl = result.audioUrl;

                    // Titolo custom (se l'utente l'ha scritto), altrimenti quello del file.
                    const customTitle = document.getElementById('upload-title-input').value.trim();
                    songData.title = customTitle || result.title;
                    songData.artist = result.artist;

                    // Copertina: file caricato dall'utente > scelta dalla galleria > placeholder casuale.
                    const customCoverFile = document.getElementById('upload-cover-input').files[0];
                    if (customCoverFile) {
                        statusMsg.innerText = "⏫ Caricamento copertina...";
                        try {
                            const imgResult = await requestImageUpload(customCoverFile);
                            songData.coverHint = imgResult.url;
                        } catch (imgErr) {
                            console.warn('Upload copertina fallito, uso placeholder:', imgErr.message);
                            songData.coverHint = randomPlaceholder().image_url;
                        }
                    } else if (chosenCoverUrl) {
                        songData.coverHint = chosenCoverUrl; // immagine da galleria placeholder, già un URL
                    } else {
                        songData.coverHint = randomPlaceholder().image_url;
                    }
                } else if (link) {
                    statusMsg.innerText = "⏬ Elaborazione link...";
                    const result = await requestDownload(link);
                    if (!result || !result.source) throw new Error("Risposta backend non valida.");

                    if (result.source === "youtube") {
                        const vid = result.youtubeId;
                        if (!vid) throw new Error("Backend non ha restituito youtubeId.");
                        songData.type = "youtube";
                        songData.audioUrl = `yt:${vid}`;
                        songData.title = result.title || `YouTube ${vid}`;
                        songData.artist = result.artist || "YouTube";
                        songData.coverHint = result.coverHint || null; // presente per brani risolti da Spotify/Deezer/Apple Music/Tidal
                    } else if (result.source === "file") {
                        songData.type = "file";
                        songData.audioUrl = result.audioUrl;
                        songData.title = result.title;
                        songData.artist = result.artist;
                        songData.coverHint = result.coverHint || null; // presente solo per i brani risolti da Spotify
                    } else {
                        throw new Error("Fonte non riconosciuta dal backend.");
                    }
                } else {
                    statusMsg.style.color = "#e05a52";
                    statusMsg.innerText = "⚠️ Inserisci un link o un file!";
                    submitBtn.disabled = false;
                    return;
                }

                const { error: insertError } = await sb.from("queue").insert({
                    type: songData.type,
                    title: songData.title,
                    artist: songData.artist,
                    audio_url: songData.audioUrl,
                    requested_by: songData.requestedBy,
                    cover_hint: songData.coverHint || null,
                });
                if (insertError) throw new Error(insertError.message);

                statusMsg.style.color = "#52c78f";
                statusMsg.innerText = "✅ Inserito in coda!";
                document.getElementById("song-link").value = "";
                fileInput.value = "";
                resetUploadDialog();
                forceCheckQueue();
            } catch (err) {
                console.error(err);
                statusMsg.style.color = "#e05a52";
                statusMsg.innerText = "❌ Errore: " + err.message;
            } finally {
                submitBtn.disabled = false;
            }
        }

        function renderQueue(items) {

            if (!items || items.length === 0) {

        function escapeHtml(s){ if(!s) return ''; return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

        // ================= CRONOLOGIA (sidebar) =================
        function formatRelativeTime(dateStr) {
            const diffMs = Date.now() - new Date(dateStr).getTime();
            const mins = Math.floor(diffMs / 60000);
            if (mins < 1) return 'ora';
            if (mins < 60) return `${mins} min fa`;
            const hours = Math.floor(mins / 60);
            if (hours < 24) return `${hours}h fa`;
            const days = Math.floor(hours / 24);
            return `${days}g fa`;
        }

        function renderHistory(items) {
            const el = document.getElementById('history-list');
            if (!items || items.length === 0) {
                el.innerHTML = '<li class="queue-empty">Ancora nessuna canzone suonata.</li>';
                return;
            }
            // La più recente in alto (ordine già decrescente dalla query).
            el.innerHTML = items.map((item) => {
                const cover = item.cover_hint || GENERIC_COVER_ICON;
                return `<li class="mini-track-item">
                    <img class="mini-cover" src="${cover}" alt="">
                    <span class="meta">
                        <div class="title-line">${escapeHtml(item.title || 'Traccia')}</div>
                        <div class="artist-line">${escapeHtml(item.artist || '')}</div>
                    </span>
                    <span class="when">${formatRelativeTime(item.played_at)}</span>
                </li>`;
            }).join('');
        }

                document.getElementById('album-cover').src = "https://via.placeholder.com/380/12151b/565c6a?text=%E2%99%AB";
                document.getElementById('song-title').innerText = "In attesa di brani...";
                document.getElementById('song-artist').innerText = "Radio online";
                document.getElementById('requested-by').innerText = "—";
                document.getElementById('artist-switcher').innerHTML = '';
                currentArtists = [];
                showPlaceholderArtist(); // niente più sidebar vuota, sempre un volto anche a riposo
                buildWaveform('idle');
                updateWaveformProgress(0, 0);
                return;
            }

            document.getElementById('song-title').innerText = data.title;
            document.getElementById('song-artist').innerText = data.artist;
            document.getElementById('requested-by').innerText = data.requested_by;

            buildWaveform((data.title || '') + '|' + (data.artist || ''));
            loadEnrichment(data.title, data.artist, data.cover_hint);

            const audioUrl = data.audio_url || '';
            const isYouTube = audioUrl.startsWith && audioUrl.startsWith('yt:');

            // Ferma SEMPRE entrambe le sorgenti prima di avviare la prossima: senza
            // questo, passando da un mp3 a un video YouTube (o viceversa) la sorgente
            // precedente restava viva e si sentivano due canzoni sovrapposte.
            if (isYouTube) {
                audioPlayer.pause();
            } else {
                try { if (window.ChinoFMYouTube) window.ChinoFMYouTube.stop(); } catch(e){}
            }

            let startOffset = 0;
            if (data.start_time) {
                startOffset = Math.floor(Math.max(0, (Date.now() - new Date(data.start_time).getTime()) / 1000));
            }

            if (isYouTube) {
                const vid = audioUrl.slice(3);
                try {
                    if (window.ChinoFMYouTube && typeof window.ChinoFMYouTube.play === 'function') {
                        window.ChinoFMYouTube.play(vid, new Date(data.start_time).getTime());
                        startYtPolling();
                    }
                } catch(e) {
                    console.warn("Errore avviando YouTube player:", e);
                }
            } else {
                if (audioPlayer.src !== audioUrl) audioPlayer.src = audioUrl;
                if (Math.abs(audioPlayer.currentTime - startOffset) > 2) {
                    try { audioPlayer.currentTime = startOffset; } catch(e){}
                }
                audioPlayer.play().then(() => setPlayingState(true)).catch(()=>{});
            }
        }

        async function loadCurrent() {
            const { data, error } = await sb.from("radio_state").select("*").eq("id", "current").maybeSingle();
            if (error) { console.error("Errore caricamento stato radio:", error.message); return; }
            renderCurrent(data);
        }

        sb.channel("state-changes")
            .on("postgres_changes", { event: "*", schema: "public", table: "radio_state" }, loadCurrent)
            .subscribe();
        loadCurrent();

        // --- AVANZAMENTO CODA ---
        async function forceCheckQueue() {
            const { data } = await sb.from("radio_state").select("id").eq("id", "current").maybeSingle();
            if (!data) advanceQueue();
        }

        async function advanceQueue() {
            // Logga nella cronologia il brano che sta per essere sostituito, prima
            // di sovrascriverlo (se ce n'era uno in riproduzione).
            const { data: outgoing } = await sb.from("radio_state").select("*").eq("id", "current").maybeSingle();
            if (outgoing && outgoing.title) {
                sb.from("history").insert({
                    title: outgoing.title,
                    artist: outgoing.artist,
                    cover_hint: outgoing.cover_hint || null,
                    requested_by: outgoing.requested_by,
                }).then(({ error }) => {
                    if (error) console.warn('Impossibile salvare in cronologia:', error.message);
                });
            }

            const { data: nextSongs, error: fetchError } = await sb
                .from("queue").select("*").order("created_at", { ascending: true }).limit(1);
            if (fetchError) { console.error("Errore lettura coda:", fetchError.message); return; }

            if (!nextSongs || nextSongs.length === 0) {
                await sb.from("radio_state").delete().eq("id", "current");
                return;
            }

            const next = nextSongs[0];
            await sb.from("radio_state").upsert({
                id: "current",
                title: next.title,
                artist: next.artist,
                audio_url: next.audio_url,
                requested_by: next.requested_by,
                cover_hint: next.cover_hint || null,
                start_time: new Date().toISOString(),
            });
            await sb.from("queue").delete().eq("id", next.id);
        }

        function forceSkip() { advanceQueue(); }

        // Waveform iniziale (stato "in attesa")
        buildWaveform('idle');
    </script>
</body>
</html>
