<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JulyFM - Web Radio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

    <!-- Firebase SDK Compatibile -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0d0e12;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            padding: 20px;
            min-height: 100vh;
        }

        .main-container {
            width: 100%;
            max-width: 580px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .player-card, .queue-card, .request-card {
            background: #16181e;
            border: 1px solid #272a34;
            border-radius: 16px;
            padding: 24px;
        }

        .player-card {
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .radio-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .radio-badge .dot {
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        .album-cover {
            width: 180px;
            height: 180px;
            border-radius: 12px;
            object-fit: cover;
            margin: 0 auto 16px;
            border: 2px solid #272a34;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .song-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
            word-break: break-word;
        }

        .song-artist {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 12px;
        }

        .requested-by {
            font-size: 0.85rem;
            color: #64748b;
            background: #1e212b;
            padding: 6px 14px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 16px;
        }

        .requested-by b {
            color: #38bdf8;
        }

        #sc-player-container, #yt-player-wrapper {
            width: 100%;
            height: 166px;
            margin-bottom: 16px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            display: none;
        }

        audio {
            width: 100%;
            margin-bottom: 16px;
            filter: invert(0.9) hue-rotate(180deg);
        }

        .skip-section {
            background: #1e212b;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .skip-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        .skip-btn:hover {
            background: #dc2626;
        }

        .voters-list {
            font-size: 0.8rem;
            color: #94a3b8;
            text-align: left;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .queue-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
        }

        .queue-item {
            background: #1e212b;
            padding: 10px 14px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .queue-item-title {
            font-weight: 600;
            color: #f1f5f9;
        }

        .queue-item-user {
            font-size: 0.75rem;
            color: #64748b;
        }

        .empty-queue {
            color: #64748b;
            font-size: 0.85rem;
            text-align: center;
            padding: 10px 0;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }

        label {
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: 600;
        }

        input[type="text"], select, input[type="file"] {
            background: #1e212b;
            border: 1px solid #334155;
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }

        .submit-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }

        #status-msg {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #f59e0b;
            text-align: center;
        }

        .start-audio-btn {
            background: #f59e0b;
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            margin-bottom: 16px;
            animation: pulse-bg 2s infinite;
        }

        @keyframes pulse-bg {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- PLAYER -->
        <div class="player-card">
            <button class="start-audio-btn" id="enable-audio-btn" onclick="unlockAudioEngine()">⚡ SBLOCCA AUDIO / AVVIA STREAM ⚡</button>

            <div class="radio-badge">
                <div class="dot"></div> LIVE RADIO
            </div>

            <img id="album-cover" class="album-cover" src="https://via.placeholder.com/180/16181e/64748b?text=JulyFM" alt="Cover">
            
            <div id="song-title" class="song-title">In attesa di brani...</div>
            <div id="song-artist" class="song-artist">Radio online</div>
            
            <div class="requested-by">Richiesta da: <b id="requested-by">---</b></div>

            <!-- YouTube Iframe -->
            <div id="yt-player-wrapper">
                <div id="yt-player"></div>
            </div>

            <!-- SoundCloud Iframe -->
            <div id="sc-player-container">
                <iframe id="sc-iframe" width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay" src=""></iframe>
            </div>

            <!-- Native Audio Player per MP3 Direct -->
            <audio id="radio-player" controls style="display:none;"></audio>

            <div class="skip-section">
                <button class="skip-btn" onclick="forceSkip()">⏭️ SALTA BRANO (SKIP)</button>
            </div>
        </div>

        <!-- CODA BRANI -->
        <div class="queue-card">
            <div class="section-title">
                <span>📋 Coda Brani</span>
                <span style="font-size: 0.8rem; color: #64748b;" id="listeners-count">Ascoltatori attivi: 1</span>
            </div>
            <ul id="queue-list" class="queue-list">
                <li class="empty-queue">La coda è vuota. Aggiungi la prima canzone!</li>
            </ul>
        </div>

        <!-- FORM RICHIESTA -->
        <div class="request-card">
            <div class="section-title">🎵 Richiedi una Canzone</div>

            <div class="form-group">
                <label>Identità:</label>
                <select id="user-mode" onchange="updateIdentity()">
                    <option value="anonymous">Anonimo</option>
                    <option value="twitch">Username Twitch</option>
                </select>
                <input type="text" id="twitch-name" placeholder="Il tuo nome Twitch..." style="display:none; margin-top:6px;">
            </div>

            <div class="form-group">
                <label>Link (YouTube, SoundCloud, MP3 diretto):</label>
                <input type="text" id="song-link" placeholder="Incolla l'URL qui...">
            </div>

            <div style="text-align: center; color: #64748b; font-size: 0.8rem; margin: 6px 0;">oppure</div>

            <div class="form-group">
                <label>Carica File Audio locale:</label>
                <input type="file" id="file-input" accept="audio/*">
            </div>

            <button class="submit-btn" onclick="handleFormSubmit()">Invia in Coda</button>
            <div id="status-msg"></div>
        </div>
    </div>

    <script>
        // CONFIGURAZIONE FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyBUwe1HzAUTn5xVs7af_w2SaUXzyvUKJM4",
            authDomain: "ch1nofm.firebaseapp.com",
            projectId: "ch1nofm",
            storageBucket: "ch1nofm.firebasestorage.app",
            messagingSenderId: "536090181047",
            appId: "1:536090181047:web:b159ecacb465fbae767c32"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let userId = localStorage.getItem("radio_uid");
        if (!userId) {
            userId = "User_" + Math.floor(Math.random() * 8999 + 1000);
            localStorage.setItem("radio_uid", userId);
        }

        let ytPlayer = null;
        let isYtReady = false;
        let currentTrackId = null;

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('yt-player', {
                height: '100%',
                width: '100%',
                playerVars: { 'autoplay': 1, 'controls': 1 },
                events: { 'onReady': () => { isYtReady = true; } }
            });
        }

        // SBLOCCO UNIFICATO DELL'AUDIO ENGINE
        function unlockAudioEngine() {
            const audioPlayer = document.getElementById('radio-player');
            audioPlayer.play().catch(() => {});
            if (ytPlayer && isYtReady && typeof ytPlayer.playVideo === 'function') {
                ytPlayer.playVideo();
            }
            const btn = document.getElementById("enable-audio-btn");
            btn.innerText = "✅ AUDIO ENGINE ATTIVO";
            btn.style.background = "#10b981";
            btn.style.color = "#ffffff";
            btn.style.animation = "none";
        }

        function updateIdentity() {
            const mode = document.getElementById("user-mode").value;
            document.getElementById("twitch-name").style.display = (mode === "twitch") ? "block" : "none";
        }

        function getActiveUserDisplayName() {
            const mode = document.getElementById("user-mode").value;
            if (mode === "twitch") {
                const name = document.getElementById("twitch-name").value.trim();
                return name ? name : userId;
            }
            return userId;
        }

        async function uploadToLitterbox(file) {
            const formData = new FormData();
            formData.append("reqtype", "fileupload");
            formData.append("time", "1h");
            formData.append("fileToUpload", file);

            const response = await fetch("https://litterbox.catbox.moe/resources/internals/api.php", {
                method: "POST",
                body: formData
            });
            return await response.text();
        }

        // SCRAPING METADATI OTTIMIZZATO (YouTube + SoundCloud oEmbed)
        async function fetchMetadata(link) {
            if (link.includes("soundcloud.com")) {
                const res = await fetch(`https://soundcloud.com/oembed?format=json&url=${encodeURIComponent(link)}`);
                if (!res.ok) throw new Error("Impossibile recuperare metadati da SoundCloud.");
                const data = await res.json();
                
                // Estrazione pulita del Titolo e dell'Artista
                let title = data.title || "Traccia SoundCloud";
                let artist = data.author_name || "SoundCloud";

                if (title.includes("by")) {
                    const parts = title.split("by");
                    title = parts[0].trim();
                    artist = parts[1].trim();
                }

                return {
                    type: "soundcloud",
                    url: link,
                    title: title,
                    artist: artist,
                    coverUrl: data.thumbnail_url || "https://via.placeholder.com/180/16181e/64748b?text=SoundCloud",
                    duration: 240
                };
            } else if (link.includes("youtube.com") || link.includes("youtu.be")) {
                const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
                const match = link.match(regExp);
                if (!match || match[2].length !== 11) throw new Error("URL YouTube non valido.");
                const videoId = match[2];

                try {
                    const res = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);
                    const data = await res.json();
                    return {
                        type: "youtube",
                        videoId: videoId,
                        title: data.title || "Traccia YouTube",
                        artist: data.author_name || "YouTube",
                        coverUrl: `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`,
                        duration: 240
                    };
                } catch (e) {
                    return {
                        type: "youtube",
                        videoId: videoId,
                        title: "Traccia YouTube",
                        artist: "YouTube",
                        coverUrl: `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`,
                        duration: 240
                    };
                }
            } else {
                return {
                    type: "direct",
                    audioUrl: link,
                    title: "Link Audio Esterno",
                    artist: "Sconosciuto",
                    coverUrl: "https://via.placeholder.com/180/16181e/64748b?text=Audio",
                    duration: 180
                };
            }
        }

        // INVIO IN CODA
        async function handleFormSubmit() {
            const statusMsg = document.getElementById("status-msg");
            const link = document.getElementById("song-link").value.trim();
            const fileInput = document.getElementById("file-input");
            const file = fileInput.files[0];
            const activeUser = getActiveUserDisplayName();

            statusMsg.innerText = "⏳ Recupero metadati e preparazioni...";

            try {
                let songData = {
                    requestedBy: String(activeUser),
                    requestedById: String(userId),
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                };

                if (file) {
                    statusMsg.innerText = "⏳ Caricamento file locale...";
                    const uploadedUrl = await uploadToLitterbox(file);
                    songData.type = "direct";
                    songData.audioUrl = uploadedUrl;
                    songData.title = file.name.replace(/\.[^/.]+$/, "");
                    songData.artist = activeUser;
                    songData.coverUrl = "https://via.placeholder.com/180/16181e/64748b?text=File+Locale";
                    songData.duration = 180;
                } else if (link) {
                    const meta = await fetchMetadata(link);
                    songData = { ...songData, ...meta };
                } else {
                    statusMsg.innerText = "⚠️ Inserisci un link o un file!";
                    return;
                }

                await db.collection("queue").add(songData);
                statusMsg.innerText = "✅ Canzone aggiunta in coda!";
                document.getElementById("song-link").value = "";
                fileInput.value = "";

                forceCheckQueue();
            } catch (err) {
                console.error(err);
                statusMsg.innerText = "❌ Errore: " + err.message;
            }
        }

        // GESTIONE CODA
        db.collection("queue").orderBy("createdAt", "asc").onSnapshot(snapshot => {
            const queueListEl = document.getElementById("queue-list");
            if (snapshot.empty) {
                queueListEl.innerHTML = '<li class="empty-queue">La coda è vuota. Aggiungi la prima canzone!</li>';
                return;
            }

            let html = "";
            snapshot.docs.forEach((doc, index) => {
                const item = doc.data();
                html += `
                    <li class="queue-item">
                        <div class="queue-item-info">
                            <span class="queue-item-title">#${index + 1} ${item.title || "Traccia"}</span>
                            <span class="queue-item-user">di ${item.artist || "Artista"} | Richiesto da: ${item.requestedBy || "Anonimo"}</span>
                        </div>
                    </li>
                `;
            });
            queueListEl.innerHTML = html;
        });

        async function forceCheckQueue() {
            const currentDoc = await db.collection("radioState").doc("current").get();
            if (!currentDoc.exists()) {
                advanceQueue();
            }
        }

        async function advanceQueue() {
            const queueSnapshot = await db.collection("queue").orderBy("createdAt", "asc").limit(1).get();
            if (queueSnapshot.empty) {
                await db.collection("radioState").doc("current").delete();
                return;
            }

            const nextSongDoc = queueSnapshot.docs[0];
            const nextSong = nextSongDoc.data();

            await db.collection("radioState").doc("current").set({
                ...nextSong,
                startTime: firebase.firestore.FieldValue.serverTimestamp()
            });

            await nextSongDoc.ref.delete();
        }

        async function forceSkip() {
            await advanceQueue();
        }

        setInterval(async () => {
            const currentDoc = await db.collection("radioState").doc("current").get();
            if (!currentDoc.exists()) {
                const queueSnapshot = await db.collection("queue").limit(1).get();
                if (!queueSnapshot.empty) advanceQueue();
            } else {
                const data = currentDoc.data();
                if (data.startTime) {
                    const elapsedTime = (Date.now() - data.startTime.toMillis()) / 1000;
                    if (elapsedTime >= data.duration) advanceQueue();
                }
            }
        }, 4000);

        // MOTOR PLAYER CENTRALIZZATO
        const audioPlayer = document.getElementById('radio-player');
        const ytWrapper = document.getElementById('yt-player-wrapper');
        const scContainer = document.getElementById('sc-player-container');
        const scIframe = document.getElementById('sc-iframe');

        db.collection("radioState").doc("current").onSnapshot(doc => {
            if (!doc.exists()) {
                audioPlayer.pause();
                audioPlayer.style.display = "none";
                ytWrapper.style.display = "none";
                scContainer.style.display = "none";
                document.getElementById('album-cover').style.display = "block";

                if (ytPlayer && isYtReady && typeof ytPlayer.stopVideo === 'function') {
                    ytPlayer.stopVideo();
                }
                scIframe.src = "";
                document.getElementById('song-title').innerText = "In attesa di brani...";
                document.getElementById('song-artist').innerText = "Radio online";
                document.getElementById('requested-by').innerText = "---";
                currentTrackId = null;
                return;
            }

            const data = doc.data();
            document.getElementById('song-title').innerText = data.title;
            document.getElementById('song-artist').innerText = data.artist;
            document.getElementById('album-cover').src = data.coverUrl || "https://via.placeholder.com/180/16181e/64748b?text=JulyFM";
            document.getElementById('requested-by').innerText = data.requestedBy;

            if (data.startTime) {
                const elapsedTimeSeconds = Math.max(0, (Date.now() - data.startTime.toMillis()) / 1000);

                if (data.type === "soundcloud") {
                    audioPlayer.pause();
                    audioPlayer.style.display = "none";
                    ytWrapper.style.display = "none";
                    document.getElementById('album-cover').style.display = "none";
                    scContainer.style.display = "block";

                    if (currentTrackId !== data.url) {
                        currentTrackId = data.url;
                        scIframe.src = `https://w.soundcloud.com/player/?url=${encodeURIComponent(data.url)}&auto_play=true&show_artwork=true`;
                    }
                } else if (data.type === "youtube" && data.videoId) {
                    audioPlayer.pause();
                    audioPlayer.style.display = "none";
                    scContainer.style.display = "none";
                    document.getElementById('album-cover').style.display = "none";
                    ytWrapper.style.display = "block";

                    if (ytPlayer && isYtReady) {
                        if (currentTrackId !== data.videoId) {
                            currentTrackId = data.videoId;
                            ytPlayer.loadVideoById(data.videoId, elapsedTimeSeconds);
                        }
                    }
                } else if (data.audioUrl) {
                    ytWrapper.style.display = "none";
                    scContainer.style.display = "none";
                    document.getElementById('album-cover').style.display = "block";
                    audioPlayer.style.display = "block";

                    if (audioPlayer.src !== data.audioUrl) {
                        audioPlayer.src = data.audioUrl;
                    }
                    if (Math.abs(audioPlayer.currentTime - elapsedTimeSeconds) > 2) {
                        audioPlayer.currentTime = elapsedTimeSeconds;
                    }
                    audioPlayer.play().catch(() => {});
                }
            }
        });

        // PRESENZA ASCOLTATORI
        setInterval(() => {
            db.collection("presences").doc(userId).set({
                lastSeen: firebase.firestore.FieldValue.serverTimestamp()
            });
        }, 5000);
    </script>
</body>
</html>
