<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JulyFM - Web Radio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #0d0e12; color: #f1f5f9; display: flex; justify-content: center; padding: 20px; min-height: 100vh; }
        .main-container { width: 100%; max-width: 580px; display: flex; flex-direction: column; gap: 20px; }
        .player-card, .queue-card, .request-card { background: #16181e; border: 1px solid #272a34; border-radius: 16px; padding: 24px; }
        .player-card { text-align: center; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
        .radio-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(239, 68, 68, 0.15); color: #ef4444; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; margin-bottom: 16px; }
        .radio-badge .dot { width: 8px; height: 8px; background-color: #ef4444; border-radius: 50%; }
        .album-cover { width: 180px; height: 180px; border-radius: 12px; object-fit: cover; margin: 0 auto 16px; border: 2px solid #272a34; }
        .song-title { font-size: 1.3rem; font-weight: 700; color: #ffffff; margin-bottom: 4px; word-break: break-word; }
        .song-artist { font-size: 0.95rem; color: #94a3b8; margin-bottom: 12px; }
        .requested-by { font-size: 0.85rem; color: #64748b; background: #1e212b; padding: 6px 14px; border-radius: 8px; display: inline-block; margin-bottom: 16px; }
        audio { width: 100%; margin-bottom: 16px; filter: invert(0.9) hue-rotate(180deg); }
        iframe { width: 100%; height: 210px; border-radius: 12px; border: none; margin-bottom: 16px; }
        .skip-btn { background: #ef4444; color: white; border: none; padding: 12px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; }
        .queue-list { list-style: none; display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; }
        .queue-item { background: #1e212b; padding: 10px 14px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
        label { font-size: 0.85rem; color: #94a3b8; font-weight: 600; }
        input[type="text"], input[type="file"] { background: #1e212b; border: 1px solid #334155; color: white; padding: 10px; border-radius: 8px; font-size: 0.9rem; outline: none; }
        .submit-btn { background: #10b981; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #status-msg { margin-top: 10px; font-size: 0.85rem; color: #f59e0b; text-align: center; }
        .start-audio-btn { background: #f59e0b; color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: 800; cursor: pointer; width: 100%; margin-bottom: 16px; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="player-card">
            <button class="start-audio-btn" id="enable-audio-btn">🔊 AVVIA STREAM RADIO</button>

            <div class="radio-badge"><div class="dot"></div> LIVE RADIO</div>

            <!-- Contenitore Copertina / Video YouTube -->
            <div id="media-container">
                <img id="album-cover" class="album-cover" src="https://via.placeholder.com/180/16181e/64748b?text=JulyFM" alt="Cover">
            </div>

            <div id="song-title" class="song-title">In attesa di brani...</div>
            <div id="song-artist" class="song-artist">Radio online</div>
            <div class="requested-by">Richiesta da: <b id="requested-by">---</b></div>

            <!-- Player Audio Nativo per File MP3 -->
            <audio id="radio-player" controls autoplay style="display: none;"></audio>

            <button class="skip-btn" onclick="forceSkip()">⏭️ SALTA BRANO (SKIP)</button>
        </div>

        <div class="queue-card">
            <div style="margin-bottom: 10px; font-weight: 700;">📋 Coda Brani</div>
            <ul id="queue-list" class="queue-list">
                <li style="color: #64748b; font-size: 0.85rem; text-align: center;">La coda è vuota.</li>
            </ul>
        </div>

        <div class="request-card">
            <div style="margin-bottom: 10px; font-weight: 700;">🎵 Richiedi una Canzone</div>
            <div class="form-group">
                <label>Link YouTube o URL MP3 diretto:</label>
                <input type="text" id="song-link" placeholder="Incolla URL YouTube o MP3...">
            </div>
            <div style="text-align: center; color: #64748b; font-size: 0.8rem; margin: 6px 0;">oppure</div>
            <div class="form-group">
                <label>Carica File Audio da PC (MP3, WAV):</label>
                <input type="file" id="file-input" accept="audio/*">
            </div>
            <button class="submit-btn" id="submit-btn" onclick="handleFormSubmit()">Invia in Coda</button>
            <div id="status-msg"></div>
        </div>
    </div>

    <!-- youtube-radio.js: player YouTube nascosto (deve essere servito come /youtube-radio.js dal tuo server static public) -->
    <script src="/youtube-radio.js"></script>

    <script>
        // --- CONFIGURAZIONE SUPABASE ---
        const SUPABASE_URL = "https://vpkpyepszskgustruoyl.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable__C7yHVyoeO0EAEOKOnSnLw_ebv3Zpp2";
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let userId = localStorage.getItem("radio_uid") || "User_" + Math.floor(Math.random() * 8999 + 1000);
        localStorage.setItem("radio_uid", userId);

        // URL del backend Render (yt-dlp + upload).
        const BACKEND_URL = "https://ch1nofm.onrender.com";

        // --- Helper: normalize/extract YouTube ID from many link forms ---
        function getYouTubeIdFromAny(url) {
          if (!url || typeof url !== 'string') return null;
          // clean spaces
          const s = url.trim();
          // direct id
          if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
          // patterns
          const m = s.match(/(?:v=|\/live\/|\/shorts\/|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
          return m ? m[1] : null;
        }

        // enable audio: tries to unlock both native audio element and YouTube hidden player
        document.getElementById('enable-audio-btn').addEventListener('click', () => {
            const player = document.getElementById('radio-player');
            player.play().catch(() => {});
            // unlock YouTube hidden player if available
            try {
                if (window.ChinoFMYouTube && typeof window.ChinoFMYouTube.unlock === 'function') {
                    window.ChinoFMYouTube.unlock();
                }
            } catch (e) {}
            const btn = document.getElementById("enable-audio-btn");
            btn.innerText = "✅ AUDIO PRONTO";
            btn.style.background = "#10b981";
            btn.style.color = "#fff";
        });

        // Helper: fetchJson like before
        async function fetchJson(url, options) {
            let res;
            try {
                res = await fetch(url, options);
            } catch (networkErr) {
                throw new Error(
                    "Impossibile contattare il backend (" + BACKEND_URL + "). " +
                    "Potrebbe essere ancora in fase di avvio: riprova tra 30-60 secondi."
                );
            }

            const raw = await res.text();
            let data;
            try {
                data = raw ? JSON.parse(raw) : {};
            } catch (parseErr) {
                console.error("Risposta non-JSON dal backend:", raw.slice(0, 300));
                throw new Error(
                    "Il backend ha risposto in modo inatteso (controlla i log su Render)."
                );
            }

            if (!res.ok) {
                throw new Error(data.error || `Errore backend (HTTP ${res.status})`);
            }
            return data;
        }

        async function requestDownload(link) {
            return fetchJson(`${BACKEND_URL}/download`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ url: link })
            });
        }

        async function requestUpload(file) {
            const formData = new FormData();
            formData.append("file", file);

            return fetchJson(`${BACKEND_URL}/upload`, {
                method: "POST",
                body: formData
            });
        }

        // --- submit handler: supporta MP3 upload OR YouTube link (backend returns source) ---
        async function handleFormSubmit() {
            const statusMsg = document.getElementById("status-msg");
            const submitBtn = document.getElementById("submit-btn");
            const link = document.getElementById("song-link").value.trim();
            const fileInput = document.getElementById("file-input");
            const file = fileInput.files[0];

            submitBtn.disabled = true;
            statusMsg.style.color = "#f59e0b";
            statusMsg.innerText = "⏳ Inserimento in corso...";

            try {
                let songData = { requestedBy: userId };

                if (file) {
                    if (file.size > 25 * 1024 * 1024) {
                        statusMsg.style.color = "#ef4444";
                        statusMsg.innerText = "⚠️ Il file supera i 25 MB!";
                        submitBtn.disabled = false;
                        return;
                    }

                    statusMsg.innerText = "⏫ Caricamento file in corso...";
                    const result = await requestUpload(file);
                    // backend returns { source: "file", audioUrl, title, artist }
                    songData.type = "file";
                    songData.audioUrl = result.audioUrl;
                    songData.title = result.title;
                    songData.artist = result.artist;

                } else if (link) {
                    // If user pasted a raw YouTube link, prefer letting backend detect it.
                    statusMsg.innerText = "⏬ Elaborazione link...";
                    const result = await requestDownload(link);

                    if (!result || !result.source) throw new Error("Risposta backend non valida.");

                    if (result.source === "youtube") {
                        // backend returned { source: "youtube", youtubeId, title, artist, startedAt }
                        const vid = result.youtubeId;
                        if (!vid) throw new Error("Backend non ha restituito youtubeId.");
                        songData.type = "youtube";
                        // store youtube id in audio_url as 'yt:VIDEOID' so server/db flow remains compatible
                        songData.audioUrl = `yt:${vid}`;
                        songData.title = result.title || `YouTube ${vid}`;
                        songData.artist = result.artist || "YouTube";
                    } else if (result.source === "file") {
                        // file fallback (other sites)
                        songData.type = "file";
                        songData.audioUrl = result.audioUrl;
                        songData.title = result.title;
                        songData.artist = result.artist;
                    } else {
                        // unknown source
                        throw new Error("Fonte non riconosciuta dal backend.");
                    }
                } else {
                    statusMsg.style.color = "#ef4444";
                    statusMsg.innerText = "⚠️ Inserisci un link o un file!";
                    submitBtn.disabled = false;
                    return;
                }

                // Insert into Supabase queue: note audio_url will contain 'yt:VIDEOID' OR direct audio URL
                const { error: insertError } = await sb.from("queue").insert({
                    type: songData.type,
                    title: songData.title,
                    artist: songData.artist,
                    audio_url: songData.audioUrl,
                    requested_by: songData.requestedBy,
                });
                if (insertError) throw new Error(insertError.message);

                statusMsg.style.color = "#10b981";
                statusMsg.innerText = "✅ Inserito in coda!";
                document.getElementById("song-link").value = "";
                fileInput.value = "";
                forceCheckQueue();
            } catch (err) {
                console.error(err);
                statusMsg.style.color = "#ef4444";
                statusMsg.innerText = "❌ Errore: " + err.message;
            } finally {
                submitBtn.disabled = false;
            }
        }

        // --- CODA: caricamento iniziale + realtime (modificato renderQueue per mostrare YT) ---
        function renderQueue(items) {
            const queueListEl = document.getElementById("queue-list");
            if (!items || items.length === 0) {
                queueListEl.innerHTML = '<li style="color: #64748b; font-size: 0.85rem; text-align: center;">La coda è vuota.</li>';
                return;
            }
            queueListEl.innerHTML = items
                .map((item, index) => {
                    const isYouTube = item.audio_url && item.audio_url.startsWith && item.audio_url.startsWith('yt:');
                    const displayTitle = item.title || (isYouTube ? (`YouTube ${item.audio_url ? item.audio_url.slice(3) : ''}`) : 'Traccia');
                    const badge = isYouTube ? '🎬' : '🎵';
                    return `<li class="queue-item">#${index + 1} ${badge} ${escapeHtml(displayTitle)} - ${escapeHtml(item.artist || '')}</li>`;
                })
                .join("");
        }

        function escapeHtml(s){ if(!s) return ''; return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

        async function loadQueue() {
            const { data, error } = await sb
                .from("queue")
                .select("*")
                .order("created_at", { ascending: true });
            if (error) { console.error("Errore caricamento coda:", error.message); return; }
            renderQueue(data);
        }

        sb
            .channel("queue-changes")
            .on("postgres_changes", { event: "*", schema: "public", table: "queue" }, loadQueue)
            .subscribe();

        loadQueue();

        // --- STATO RADIO (brano corrente): caricamento iniziale + realtime ---
        const audioPlayer = document.getElementById('radio-player');
        const mediaContainer = document.getElementById('media-container');

        audioPlayer.addEventListener('error', () => {
            console.warn("Errore riproduzione audio, skip automatico.");
            advanceQueue();
        });

        // renderCurrent now supports both 'file' and youtube (audio_url 'yt:ID')
        function renderCurrent(data) {
            if (!data) {
                // stop everything
                try { if (window.ChinoFMYouTube) window.ChinoFMYouTube.stop(); } catch(e){}
                audioPlayer.pause();
                audioPlayer.removeAttribute('src');
                audioPlayer.style.display = "none";
                mediaContainer.innerHTML = `<img id="album-cover" class="album-cover" src="https://via.placeholder.com/180/16181e/64748b?text=JulyFM" alt="Cover">`;
                document.getElementById('song-title').innerText = "In attesa di brani...";
                document.getElementById('song-artist').innerText = "Radio online";
                document.getElementById('requested-by').innerText = "---";
                return;
            }

            document.getElementById('song-title').innerText = data.title;
            document.getElementById('song-artist').innerText = data.artist;
            document.getElementById('requested-by').innerText = data.requested_by;

            const audioUrl = data.audio_url || '';
            const isYouTube = audioUrl.startsWith && audioUrl.startsWith('yt:');

            // compute start offset based on start_time
            let startOffset = 0;
            if (data.start_time) {
                startOffset = Math.floor(Math.max(0, (Date.now() - new Date(data.start_time).getTime()) / 1000));
            }

            // reset UI
            audioPlayer.style.display = "none";
            mediaContainer.innerHTML = `<img id="album-cover" class="album-cover" src="https://via.placeholder.com/180/16181e/64748b?text=JulyFM" alt="Cover">`;

            if (isYouTube) {
                // hide native audio player, use hidden YouTube player
                const vid = audioUrl.slice(3);
                try {
                    // play via global YouTube player module; it expects startedAt in ms
                    if (window.ChinoFMYouTube && typeof window.ChinoFMYouTube.play === 'function') {
                        window.ChinoFMYouTube.play(vid, new Date(data.start_time).getTime());
                    } else {
                        console.warn("YouTube player non pronto, chiameremo play quando pronto.");
                        // ChinoFMYouTube will handle pendingTrack if not ready
                        if (window.ChinoFMYouTube && typeof window.ChinoFMYouTube.init === 'function') window.ChinoFMYouTube.init();
                        // store pending via global function (the module has pending handling)
                        if (window.ChinoFMYouTube && typeof window.ChinoFMYouTube.play === 'function') {
                            window.ChinoFMYouTube.play(vid, new Date(data.start_time).getTime());
                        }
                    }
                } catch(e) {
                    console.warn("Errore avviando YouTube player:", e);
                }
            } else {
                // file: show audio tag and play from offset
                audioPlayer.style.display = "block";
                if (audioPlayer.src !== audioUrl) {
                    audioPlayer.src = audioUrl;
                }
                if (Math.abs(audioPlayer.currentTime - startOffset) > 2) {
                    try { audioPlayer.currentTime = startOffset; } catch(e){}
                }
                audioPlayer.play().catch(()=>{});
            }
        }

        async function loadCurrent() {
            const { data, error } = await sb
                .from("radio_state")
                .select("*")
                .eq("id", "current")
                .maybeSingle();
            if (error) { console.error("Errore caricamento stato radio:", error.message); return; }
            renderCurrent(data);
        }

        sb
            .channel("state-changes")
            .on("postgres_changes", { event: "*", schema: "public", table: "radio_state" }, loadCurrent)
            .subscribe();

        loadCurrent();

        // --- AVANZAMENTO CODA (unchanged logic) ---
        async function forceCheckQueue() {
            const { data } = await sb
                .from("radio_state")
                .select("id")
                .eq("id", "current")
                .maybeSingle();
            if (!data) advanceQueue();
        }

        async function advanceQueue() {
            const { data: nextSongs, error: fetchError } = await sb
                .from("queue")
                .select("*")
                .order("created_at", { ascending: true })
                .limit(1);

            if (fetchError) { console.error("Errore lettura coda:", fetchError.message); return; }

            if (!nextSongs || nextSongs.length === 0) {
                await sb.from("radio_state").delete().eq("id", "current");
                return;
            }

            const next = nextSongs[0];
            await sb.from("radio_state").upsert({
                id: "current",
                title: next.title,
                artist: next.artist,
                audio_url: next.audio_url,
                requested_by: next.requested_by,
                start_time: new Date().toISOString(),
            });
            await sb.from("queue").delete().eq("id", next.id);
        }

        function forceSkip() { advanceQueue(); }
    </script>
</body>
</html>
